name: Update Nix release pins

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (leave empty for latest published release)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nix-release-pins
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update release hashes
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
        run: go run ./internal/tools/updatebin "$VERSION"

      - name: Push release pins
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git push origin "HEAD:$DEFAULT_BRANCH"
