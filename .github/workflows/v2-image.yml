name: Publish v2 image

on:
  push:
    branches:
      - v2

concurrency:
  group: publish-v2-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write


jobs:
  publish:
    name: Build and publish v2 image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --id teldrive

      - name: Prepare image context
        run: |
          mkdir -p image-context/linux/amd64 image-context/linux/arm64
          cp dist/teldrive_linux_amd64_v1/teldrive image-context/linux/amd64/teldrive
          cp dist/teldrive_linux_arm64_v8.0/teldrive image-context/linux/arm64/teldrive
          cp .goreleaser.Dockerfile image-context/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: image-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:v2
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=v2
