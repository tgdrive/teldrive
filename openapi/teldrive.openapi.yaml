        displayName:
          type: string
        username:
          type: string
        premium:
          type: boolean
        role:
          $ref: "#/components/schemas/UserRole"
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserAdminUpdateRequest:
