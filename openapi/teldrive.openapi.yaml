components:
  parameters:
    IdempotencyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable UUID generated by the caller for safe request retries.
      schema:
        $ref: "#/components/schemas/Uuid"
    RefreshCookie:
      name: teldrive_refresh
      in: cookie
      required: true
      schema:
        type: string
      explode: false
    CursorQuery.cursor:
      name: cursor
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Cursor"
      explode: false
    CursorQuery.limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 100
      explode: false
    FileListQuery.parentId:
      name: parentId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
      explode: false
    FileListQuery.path:
      name: path
      in: query
      required: false
      description: Resolve the listing root relative to the user's drive root.
      schema:
        type: string
        maxLength: 4096
      explode: false
    FileListQuery.kind:
      name: kind
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/FileKind"
      explode: false
    FileListQuery.status:
      name: status
      in: query
      required: false
      schema:
        allOf:
          - $ref: "#/components/schemas/FileStatus"
        default: active
      explode: false
    FileListQuery.search:
      name: search
      in: query
      required: false
      description: File-name search. Text search is case-insensitive; regex uses
        PostgreSQL-compatible regular expressions.
      schema:
        type: string
        maxLength: 512
      explode: false
    FileListQuery.searchType:
      name: searchType
      in: query
      required: false
      schema:
        allOf:
          - $ref: "#/components/schemas/FileSearchType"
        default: text
      explode: false
    FileListQuery.category:
      name: category
      in: query
      required: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/FileCategory"
      explode: false
    FileListQuery.updatedAfter:
      name: updatedAfter
      in: query
      required: false
      schema:
        type: string
        format: date-time
      explode: false
    FileListQuery.updatedBefore:
      name: updatedBefore
      in: query
      required: false
      schema:
        type: string
        format: date-time
      explode: false
    FileListQuery.sort:
      name: sort
      in: query
      required: false
      schema:
        allOf:
          - $ref: "#/components/schemas/FileSort"
        default: name
      explode: false
    FileListQuery.order:
      name: order
      in: query
      required: false
      schema:
        allOf:
          - $ref: "#/components/schemas/SortOrder"
        default: asc
      explode: false
    OptionalIfMatchHeader:
      name: If-Match
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/ETag"
    FileContentRequestOptions.range:
      name: Range
      in: header
      required: false
      schema:
        type: string
    FileContentRequestOptions.ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/ETag"
    FileContentRequestOptions.download:
      name: download
      in: query
      required: false
      description: Force a browser download instead of inline display.
      schema:
        type: string
        enum:
          - "1"
      explode: false
    UploadPartHeaders.contentLength:
      name: Content-Length
      in: header
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    UploadPartHeaders.checksum:
      name: X-Part-Checksum
      in: header
      required: false
      description: BLAKE3 checksum of the plaintext part.
      schema:
        $ref: "#/components/schemas/Checksum"
    SharePasswordHeader:
      name: X-Share-Password
      in: header
      required: false
      schema:
        type: string
    PublicShareListQuery.path:
      name: path
      in: query
      required: false
      description: Folder path relative to the shared folder root.
      schema:
        type: string
        maxLength: 4096
      explode: false
    PublicShareListQuery.search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      explode: false
    JobListQuery.status:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/JobState"
      explode: false
    JobListQuery.type:
      name: type
      in: query
      required: false
      schema:
        type: string
      explode: false
    JobListQuery.queue:
      name: queue
      in: query
      required: false
      schema:
        type: string
      explode: false
    JobPurgeQuery:
      name: status
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/JobState"
      explode: false
  schemas:
    HealthStatus:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        version:
          type: string
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        details:
          type: object
          additionalProperties: {}
          description: Optional structured context for the caller.
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    Uuid:
      type: string
      format: uuid
    TelegramLoginStartResponse:
      type: object
      required:
        - flowId
        - expiresAt
        - passwordRequired
      properties:
        flowId:
          $ref: "#/components/schemas/Uuid"
        expiresAt:
          type: string
          format: date-time
        passwordRequired:
          type: boolean
    TelegramLoginStartRequest:
      type: object
      required:
        - phoneNumber
      properties:
        phoneNumber:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          description: Phone number in E.164 format.
    TelegramQRLoginState:
      type: string
      enum:
        - pending
        - password_required
    TelegramQRLoginResponse:
      type: object
      required:
        - flowId
        - expiresAt
        - state
      properties:
        flowId:
          $ref: "#/components/schemas/Uuid"
        expiresAt:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/TelegramQRLoginState"
        qrUrl:
          type: string
        qrExpiresAt:
          type: string
          format: date-time
    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          format: int32
    TelegramQRLoginPollRequest:
      type: object
      required:
        - flowId
      properties:
        flowId:
          $ref: "#/components/schemas/Uuid"
    TelegramCodeVerifyRequest:
      type: object
      required:
        - flowId
        - code
      properties:
        flowId:
          $ref: "#/components/schemas/Uuid"
        code:
          type: string
          minLength: 1
          maxLength: 16
    TelegramPasswordVerifyRequest:
      type: object
      required:
        - flowId
        - password
      properties:
        flowId:
          $ref: "#/components/schemas/Uuid"
        password:
          type: string
          minLength: 1
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
    CookieSession:
      type: object
      required:
        - authenticated
        - expiresAt
      properties:
