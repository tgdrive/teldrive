openapi: 3.0.0
info:
  title: TelDrive API
  version: 1.0.0
  summary: Telegram-backed cloud drive API
  description: >-
    Backend-first API for rclone and other TelDrive clients. Upload sessions are

    durable, API instances are stateless, and completed files are immediately
    readable.
tags:
  - name: System
  - name: Authentication
  - name: Account
  - name: Users
  - name: Administration
  - name: API keys
  - name: Sessions
  - name: Channels
  - name: Bots
  - name: Events
  - name: Files
  - name: Folders
  - name: Uploads
  - name: Shares
  - name: Public shares
  - name: Jobs
  - name: Periodic Jobs
  - name: Storage
paths:
  /health/live:
    get:
      operationId: healthLive
      description: Process liveness check.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      tags:
        - System
      security:
        - {}
  /health/ready:
    get:
      operationId: healthReady
      description: Readiness check for PostgreSQL, migrations, and required runtime state.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - System
      security:
        - {}
  /v1/auth/telegram/start:
    post:
      operationId: telegramLoginStart
      description: Begin Telegram authentication and send a login code.
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      responses:
        "201":
          description: The request has succeeded and a new resource has been created as a
            result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLoginStartResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramLoginStartRequest"
      security:
        - {}
  /v1/auth/telegram/qr/start:
    post:
      operationId: telegramQRLoginStart
      description: Begin a resumable Telegram QR login flow.
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      responses:
        "201":
          description: The request has succeeded and a new resource has been created as a
            result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramQRLoginResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      security:
        - {}
  /v1/auth/telegram/qr/poll:
    post:
      operationId: telegramQRLoginPoll
      description: Poll a Telegram QR login flow. Any API replica can resume the
        encrypted flow state.
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "202":
          description: The request has been accepted for processing, but processing has
            not yet completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramQRLoginResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramQRLoginPollRequest"
      security:
        - {}
  /v1/auth/telegram/verify-code:
    post:
      operationId: telegramLoginVerifyCode
      description: Verify the Telegram login code.
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "202":
          description: The request has been accepted for processing, but processing has
            not yet completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLoginStartResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramCodeVerifyRequest"
      security:
        - {}
  /v1/auth/telegram/verify-password:
    post:
      operationId: telegramLoginVerifyPassword
      description: Complete Telegram two-step verification.
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramPasswordVerifyRequest"
      security:
        - {}
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      description: Rotate an access/refresh token pair.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      security:
        - {}
  /v1/auth/cookie/telegram/verify-code:
    post:
      operationId: cookieTelegramLoginVerifyCode
      description: Complete Telegram code verification and establish an HttpOnly
        cookie session.
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      responses:
        "200":
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieSession"
        "202":
          description: The request has been accepted for processing, but processing has
            not yet completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLoginStartResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramCodeVerifyRequest"
      security:
        - {}
  /v1/auth/cookie/telegram/verify-password:
    post:
      operationId: cookieTelegramLoginVerifyPassword
      description: Complete Telegram password verification and establish an HttpOnly
        cookie session.
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      responses:
        "200":
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieSession"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramPasswordVerifyRequest"
      security:
        - {}
  /v1/auth/cookie/telegram/qr/poll:
    post:
      operationId: cookieTelegramQRLoginPoll
      description: Poll Telegram QR login and establish an HttpOnly cookie session
        when authorized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      responses:
        "200":
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieSession"
        "202":
          description: The request has been accepted for processing, but processing has
            not yet completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramQRLoginResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "410":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramQRLoginPollRequest"
      security:
        - {}
  /v1/auth/cookie/refresh:
    post:
      operationId: refreshCookieSession
      description: Rotate session cookies using the HttpOnly refresh cookie.
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
      responses:
        "200":
          description: The request has succeeded.
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieSession"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      security:
        - {}
  /v1/auth/cookie/logout:
    post:
      operationId: logoutCookieSession
      description: Revoke the cookie session and clear its HttpOnly cookies.
      parameters: []
      responses:
        "204":
          description: "There is no content to send for this request, but the headers may
            be useful. "
          headers:
            Set-Cookie:
              required: true
              schema:
                type: array
                items:
                  type: string
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Authentication
      security:
        - CookieAuth: []
  /v1/me:
    get:
      operationId: getCurrentUser
      description: Return the authenticated user profile.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Account
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/me/photo:
    get:
      operationId: getProfilePhoto
      description: Return the authenticated Telegram user's small profile photo.
      parameters: []
      responses:
        "200":
          description: The request has succeeded.
          headers:
            Content-Length:
              required: true
              schema:
                type: integer
                format: int64
            Cache-Control:
              required: true
              schema:
                type: string
            Etag:
              required: true
              schema:
                $ref: "#/components/schemas/ETag"
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "204":
          description: "There is no content to send for this request, but the headers may
            be useful. "
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Account
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/auth/logout:
    post:
      operationId: logoutSession
      description: Revoke the current session.
      parameters: []
      responses:
        "204":
          description: "There is no content to send for this request, but the headers may
            be useful. "
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Account
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/users/search:
    get:
      operationId: searchUsers
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSearchResult"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Users
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/admin/users:
    get:
      operationId: listAdminUsers
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUserSummary"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Administration
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/admin/users/{userId}:
    patch:
      operationId: updateAdminUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserSummary"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAdminUpdateRequest"
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/admin/users/{userId}/revoke-access:
    post:
      operationId: revokeAdminUserAccess
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: "There is no content to send for this request, but the headers may
            be useful. "
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - Administration
      security:
        - BearerAuth: []
        - CookieAuth: []
        - ExternalApiKeyAuth: []
  /v1/api-keys:
    get:
      operationId: listApiKeys
      parameters:
        - $ref: "#/components/parameters/CursorQuery.cursor"
        - $ref: "#/components/parameters/CursorQuery.limit"
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeySummary"
                  nextCursor:
                    $ref: "#/components/schemas/Cursor"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - API keys
      security:
        - BearerAuth: []
        - CookieAuth: []
    post:
      operationId: createApiKey
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      responses:
        "201":
          description: The request has succeeded and a new resource has been created as a
            result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - API keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreateRequest"
      security:
        - BearerAuth: []
        - CookieAuth: []
  /v1/api-keys/{apiKeyId}:
    delete:
      operationId: revokeApiKey
      parameters:
        - name: apiKeyId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "204":
          description: "There is no content to send for this request, but the headers may
            be useful. "
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      tags:
        - API keys
      security:
        - BearerAuth: []
        - CookieAuth: []
  /v1/sessions:
    get:
      operationId: listSessions
      description: List all TelDrive sessions for the authenticated Telegram account.
      parameters:
        - $ref: "#/components/parameters/CursorQuery.cursor"
        - $ref: "#/components/parameters/CursorQuery.limit"
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionSummary"
                  nextCursor:
                    $ref: "#/components/schemas/Cursor"
        "401":
          description: Access is unauthorized.
          content:
            application/json:
              schema:
